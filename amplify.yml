# Especificación de build para AWS Amplify Hosting (app Next.js estándar, plataforma WEB_COMPUTE).
# next build deja el resultado en `.next/` (incluye required-server-files.json, que Amplify exige).
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22 && nvm use 22
        - node -v && npm -v
        - npm ci
    build:
      commands:
        - npm run lint
        - npm run typecheck
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
