# Cabeceras HTTP que Amplify Hosting añade a cada respuesta.
# (En una exportación estática, `headers()` de next.config no aplica: se configuran aquí.)
customHeaders:
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - key: Cross-Origin-Opener-Policy
        value: same-origin
      # CSP: todo se sirve desde el propio dominio (fuentes incluidas).
      # - 'unsafe-inline' en script-src: Next inyecta scripts de hidratación en línea en el HTML estático
      #   (sin servidor no hay nonce por petición).
      # - 'wasm-unsafe-eval': el decodificador Meshopt de modelos GLB usa WebAssembly.
      # - blob:/data: en img-src: miniaturas y exportación PNG se generan en el navegador.
      - key: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: blob:;
          font-src 'self';
          connect-src 'self' blob: data:;
          worker-src 'self' blob:;
          object-src 'none';
          base-uri 'self';
          form-action 'self';
          frame-ancestors 'none';
          upgrade-insecure-requests
  # Recursos con hash en el nombre: caché larga e inmutable
  - pattern: '_next/static/**/*'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  # Modelos GLB publicados: caché de 1 día (cámbialos de nombre al actualizarlos)
  - pattern: 'models/**/*'
    headers:
      - key: Cache-Control
        value: public, max-age=86400
